spring.application.name=cyber-threat-dashboard

# Default profile (can be overridden by SPRING_PROFILES_ACTIVE=prod on Render)
spring.profiles.default=dev

# Server Port (Render injects dynamic PORT environment variable)
server.port=${PORT:8080}

# Actuator Endpoints for Render Health Checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Database Configuration with Environment Variable Overrides
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cyber_threat_dashboard}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Defaults
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Jackson Date Formatting
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Threat Ingestion Scheduler Configuration (Every 15 minutes = 900000 ms)
threat.scheduler.enabled=true
threat.scheduler.fixed-rate-ms=900000
threat.scheduler.cron=0 */15 * * * ?
threat.ingestion.batch-limit=3000

# Live Threat Feeds
threat.feed.urlhaus.enabled=true
threat.feed.urlhaus.url=https://urlhaus.abuse.ch/downloads/json_recent/
threat.feed.threatfox.enabled=true
threat.feed.threatfox.url=https://threatfox.abuse.ch/export/json/recent/
threat.feed.openphish.enabled=true
threat.feed.openphish.url=https://raw.githubusercontent.com/openphish/public_feed/refs/heads/main/feed.txt
threat.feed.tweetfeed.enabled=true
threat.feed.tweetfeed.initial-url=https://api.tweetfeed.live/v1/month
threat.feed.tweetfeed.incremental-url=https://api.tweetfeed.live/v1/today

# Public IP Geolocation Configuration
geo.api.enabled=true
geo.api.base-url=https://ipapi.co
geo.api.connect-timeout-ms=5000
geo.api.read-timeout-ms=5000

# Logging
logging.level.com.cyberthreat.dashboard=INFO
logging.level.org.springframework.web=INFO

