server.port=8080

# Database Configuration with Environment Variable Overrides
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cyber_threat_dashboard}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.type.descriptor.sql=TRACE
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# Jackson Date Formatting
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Management / Actuator
management.endpoints.web.exposure.include=health,info

# Threat Ingestion Scheduler Configuration (Every 15 minutes = 900000 ms)
threat.scheduler.enabled=true
threat.scheduler.fixed-rate-ms=900000
threat.scheduler.cron=0 */15 * * * ?
threat.ingestion.batch-limit=2500

# Live Threat Feeds
threat.feed.urlhaus.enabled=true
threat.feed.urlhaus.url=https://urlhaus.abuse.ch/downloads/json_recent/
threat.feed.threatfox.enabled=true
threat.feed.threatfox.url=https://threatfox.abuse.ch/export/json/recent/
threat.feed.openphish.enabled=true
threat.feed.openphish.url=https://raw.githubusercontent.com/openphish/public_feed/refs/heads/main/feed.txt
threat.feed.tweetfeed.enabled=true
threat.feed.tweetfeed.initial-url=https://api.tweetfeed.live/v1/month
threat.feed.tweetfeed.incremental-url=https://api.tweetfeed.live/v1/today

# Public IP Geolocation Configuration
geo.api.enabled=true
geo.api.base-url=https://ipapi.co
geo.api.connect-timeout-ms=5000
geo.api.read-timeout-ms=5000

# Logging
logging.level.com.cyberthreat.dashboard=INFO
logging.level.org.springframework.web=INFO
